{% extends "base.html" %}

{% block conteudo %}
<section class="confirmacao">
    <div class="confirmacao-icone">!</div>
    <span class="etiqueta">Confirmação necessária</span>
    <h1>{{ titulo }}</h1>
    <p>Você realmente deseja excluir <strong>{{ registro }}</strong>? Esta ação não poderá ser desfeita.</p>
    <form method="post" class="acoes-formulario">
        <button class="botao perigo" type="submit">Sim, excluir</button>
        <a class="botao secundario" href="{{ url_for(voltar) }}">Cancelar</a>
    </form>
</section>
{% endblock %}

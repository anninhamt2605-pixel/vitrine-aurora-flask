{% extends "base.html" %}

{% block conteudo %}
<section class="cabecalho-pagina cabecalho-compacto">
    <span class="etiqueta">Formulário</span>
    <h1>{{ titulo }}</h1>
    <p>Preencha os campos abaixo e salve o registro.</p>
</section>

<form method="post" class="formulario">
    {% for campo in campos %}
    <div class="grupo-campo">
        <label for="{{ campo.name }}">{{ campo.label }}</label>

        {% if campo.type == 'textarea' %}
            <textarea id="{{ campo.name }}" name="{{ campo.name }}" {% if campo.required %}required{% endif %}>{{ campo.value }}</textarea>
        {% elif campo.type == 'select' %}
            <select id="{{ campo.name }}" name="{{ campo.name }}" {% if campo.required %}required{% endif %}>
                <option value="">Selecione uma opção</option>
                {% for valor, texto in campo.options %}
                    <option value="{{ valor }}" {% if valor|string == campo.value|string %}selected{% endif %}>{{ texto }}</option>
                {% endfor %}
            </select>
        {% else %}
            <input id="{{ campo.name }}" name="{{ campo.name }}" type="{{ campo.type }}"
                   value="{{ campo.value }}" {% if campo.step %}step="{{ campo.step }}"{% endif %}
                   {% if campo.min %}min="{{ campo.min }}"{% endif %} {% if campo.required %}required{% endif %}>
        {% endif %}
    </div>
    {% endfor %}

    <div class="acoes-formulario">
        <button class="botao primario" type="submit">Salvar</button>
        <a class="botao secundario" href="{{ url_for(voltar) }}">Cancelar</a>
    </div>
</form>
{% endblock %}

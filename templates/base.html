<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo if titulo else 'Vitrine Aurora' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo">
        <a class="marca" href="{{ url_for('inicio') }}">
            <span class="marca-icone">A</span>
            <span>Vitrine Aurora</span>
        </a>
        <nav class="menu" aria-label="Menu principal">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('anuncios') }}">Anuncios</a>
            <a href="{{ url_for('categorias') }}">Categorias</a>
            <a href="{{ url_for('perguntas') }}">Perguntas</a>
            <a href="{{ url_for('favoritos') }}">Favoritos</a>
            <a href="{{ url_for('compras') }}">Compras</a>
            <a href="{{ url_for('usuarios') }}">Usuarios</a>
            <div class="dropdown">
                <button class="dropbtn">Relatorios</button>
                <div class="dropdown-conteudo">
                    <a href="{{ url_for('relatorio_compras') }}">Minhas compras</a>
                    <a href="{{ url_for('relatorio_vendas') }}">Minhas vendas</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Projeto academico Flask - Anna - 2026</p>
    </footer>
</body>
</html>
